# Disposable local integration database only. No application or worker exposure.
services:
  postgres:
    profiles: [disposable-dev]
    # Local inspection identified this as postgres:16.10-alpine on 2026-10-08.
    image: postgres@sha256:029660641a0cfc575b14f336ba448fb8a75fd595d42e1fa316b9fb4378742297
    pull_policy: never
    restart: "no"
    environment:
      POSTGRES_USER: cam_dev
      POSTGRES_DB: cam_test
      # Explicit dev-only trust authentication. Never use this profile remotely.
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:${CAM_POSTGRES_PORT:-15432}:5432"
    tmpfs:
      - /var/lib/postgresql/data:size=268435456,mode=0700
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U cam_dev -d cam_test"]
      interval: 2s
      timeout: 3s
      retries: 15
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128
    labels:
      coding-agent-mastery.scope: disposable-local-integration-only
