[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "coding-agent-mastery"
version = "0.1.0"
description = "Inspectable durable coding-agent reference and research workbench"
requires-python = ">=3.11"
dependencies = [
  "sqlalchemy>=2.0.36,<2.2",
  "fastapi>=0.128.5,<1",
  "httpx>=0.28.1,<1",
  "uvicorn>=0.30,<1",
  "PyYAML==6.0.3",
]

[project.optional-dependencies]
production = ["psycopg[binary]>=3.2.3,<4", "temporalio>=1.8,<2", "boto3>=1.35,<2", "opentelemetry-api>=1.28,<2"]
compute = ["torch>=2.7.1,<3", "numpy>=1.26,<3"]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[project.scripts]
agent-lab = "service.cli:main"

[tool.setuptools.packages.find]
include = ["service*", "evals*", "compute*", "workloads*"]

[tool.setuptools.package-data]
workloads = ["manifests/*.json", "baseline/**/*.py", "oracle/**/*.py", "oracle/**/*.patch", "evidence/*.json", "repair/**/*.py", "repair/**/*.json", "skills/verified-repair-guide/SKILL.md", "skills/verified-repair-guide/references/checklist.md", "skills/verified-repair-guide/assets/example.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["postgres: requires explicit disposable PostgreSQL URL", "docker: runs isolated task-owned Linux containers", "temporal: requires an explicit local Temporal server", "gpu: requires CUDA hardware"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
